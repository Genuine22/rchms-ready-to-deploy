{% extends "base.html" %}
{% block title %}Record Payment{% endblock %}

{% block content %}
<div class="form-shell">
    <div class="form-shell-icon gold"><i data-lucide="banknote"></i></div>
    <h1 class="page-title" style="font-size: 1.4rem;">Record Payment</h1>
    <p class="page-subtitle mb-4">
        {{ subscription.subscriber.full_name }} &middot; {{ subscription.plan.plan_name if subscription.plan else "Deleted plan" }}
        &middot; Voucher: <code>{{ subscription.voucher_code }}</code>
    </p>

    <div class="card">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('starlink.record_subscription_payment', subscription_id=subscription.subscription_id) }}">
                <div class="mb-3">
                    <label class="form-label">Amount (GHS)</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" name="amount"
                           value="{{ suggested_amount }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Payment Method</label>
                    <select class="form-select" name="payment_method" required>
                        <option value="cash">Cash</option>
                        <option value="mobile_money">Mobile Money</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Receipt Number <span class="text-muted">(optional)</span></label>
                    <input type="text" class="form-control" name="receipt_number" placeholder="e.g. SLR-000123">
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-gold">Record Payment & Activate</button>
                    <a href="{{ url_for('starlink.view_subscription', subscription_id=subscription.subscription_id) }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
