{% extends "base.html" %}
{% block title %}Add Plan{% endblock %}

{% block content %}
<div class="form-shell">
    <div class="form-shell-icon gold"><i data-lucide="package"></i></div>
    <h1 class="page-title" style="font-size: 1.4rem;">Add Starlink Plan</h1>
    <p class="page-subtitle mb-4">Weekly, monthly, or occasion-based.</p>

    <div class="card">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('starlink.add_plan') }}">
                <div class="mb-3">
                    <label class="form-label">Plan Name</label>
                    <input type="text" class="form-control" name="plan_name" placeholder="e.g. Monthly - 75GB" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Plan Type</label>
                    <select class="form-select" name="plan_type" required>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="occasion">Occasion (short-term)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Duration (days)</label>
                    <input type="number" min="1" class="form-control" name="duration_days" placeholder="e.g. 30" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Data Allocation (GB)</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" name="data_allocation_gb" placeholder="e.g. 75" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Price (GHS)</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" name="price" required>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-gold">Add Plan</button>
                    <a href="{{ url_for('starlink.list_plans') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
