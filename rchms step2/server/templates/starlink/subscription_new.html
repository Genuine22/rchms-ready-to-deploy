{% extends "base.html" %}
{% block title %}New Subscription{% endblock %}

{% block content %}
<div class="form-shell" style="max-width: 560px;">
    <div class="form-shell-icon gold"><i data-lucide="file-plus"></i></div>
    <h1 class="page-title" style="font-size: 1.4rem;">New Starlink Subscription</h1>
    <p class="page-subtitle mb-4">A voucher code will be generated automatically.</p>

    <div class="card">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('starlink.new_subscription') }}">
                <div class="mb-3">
                    <label class="form-label">Subscriber</label>
                    <select class="form-select" name="subscriber_id" required>
                        <option value="" disabled selected>Select a subscriber...</option>
                        {% for subscriber in subscribers %}
                        <option value="{{ subscriber.subscriber_id }}"
                            {% if preselected_subscriber == subscriber.subscriber_id %}selected{% endif %}>
                            {{ subscriber.full_name }} - {{ subscriber.phone_number }}
                        </option>
                        {% endfor %}
                    </select>
                    <div class="form-text">
                        Don't see them? <a href="{{ url_for('starlink.register_subscriber') }}">Register a new subscriber</a>.
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Plan</label>
                    <select class="form-select" name="plan_id" required>
                        <option value="" disabled selected>Select a plan...</option>
                        {% for plan in plans %}
                        <option value="{{ plan.plan_id }}">
                            {{ plan.plan_name }} ({{ plan.duration_days }} days, {{ plan.data_allocation_gb }}GB) - GHS {{ "%.2f"|format(plan.price) }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" class="form-control" name="start_date" value="{{ today }}">
                    <div class="form-text">Defaults to today if left unchanged.</div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-gold">Create Subscription</button>
                    <a href="{{ url_for('starlink.list_subscriptions') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
