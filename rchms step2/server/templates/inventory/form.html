{% extends "base.html" %}
{% block title %}{{ 'Edit Item' if item else 'Add Item' }}{% endblock %}

{% block content %}
<div class="form-shell" style="max-width: 720px;">
    <div class="form-shell-icon gold"><i data-lucide="package-plus"></i></div>
    <h1 class="page-title" style="font-size: 1.4rem;">{{ 'Edit Item' if item else 'Add Inventory Item' }}</h1>
    <p class="page-subtitle mb-4">{{ item.item_name if item else 'New warehouse stock item' }}</p>

    <div class="card">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('inventory.edit_item', item_id=item.item_id) if item else url_for('inventory.new_item') }}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Category *</label>
                        <select class="form-select" name="category_id" required>
                            {% for c in categories %}
                            <option value="{{ c.category_id }}" {% if item and item.category_id == c.category_id %}selected{% endif %}>{{ c.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Item Name *</label>
                        <input type="text" class="form-control" name="item_name" required value="{{ item.item_name if item else '' }}">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Brand</label>
                        <input type="text" class="form-control" name="brand" value="{{ item.brand if item else '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Model</label>
                        <input type="text" class="form-control" name="model" value="{{ item.model if item else '' }}">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Serial Number</label>
                        <input type="text" class="form-control" name="serial_number" value="{{ item.serial_number if item else '' }}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Asset Tag</label>
                        <input type="text" class="form-control" name="asset_tag" value="{{ item.asset_tag if item else '' }}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">QR Code (optional)</label>
                        <input type="text" class="form-control" name="qr_code" value="{{ item.qr_code if item else '' }}">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Unit</label>
                        <input type="text" class="form-control" name="unit" placeholder="pcs, meters, box" value="{{ item.unit if item else 'pcs' }}">
                    </div>
                    {% if not item %}
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Opening Stock</label>
                        <input type="number" step="0.01" class="form-control" name="quantity_in_stock" value="0">
                    </div>
                    {% endif %}
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Minimum Stock Level</label>
                        <input type="number" step="0.01" class="form-control" name="minimum_stock_level" value="{{ item.minimum_stock_level if item else 0 }}">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Unit Cost</label>
                        <input type="number" step="0.01" class="form-control" name="unit_cost" value="{{ item.unit_cost if item else '' }}">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Supplier</label>
                        <input type="text" class="form-control" name="supplier" value="{{ item.supplier if item else '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Warehouse Location</label>
                        <input type="text" class="form-control" name="warehouse_location" value="{{ item.warehouse_location if item else '' }}">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Purchase Date</label>
                        <input type="date" class="form-control" name="purchase_date" value="{{ item.purchase_date.isoformat() if item and item.purchase_date else '' }}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Warranty Expiry</label>
                        <input type="date" class="form-control" name="warranty_expiry" value="{{ item.warranty_expiry.isoformat() if item and item.warranty_expiry else '' }}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" name="status">
                            {% for s in statuses %}
                            <option value="{{ s }}" {% if item and item.status == s %}selected{% elif not item and s == 'available' %}selected{% endif %}>{{ s|title }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Notes</label>
                    <textarea class="form-control" name="notes" rows="2">{{ item.notes if item else '' }}</textarea>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-gold">{{ 'Save Changes' if item else 'Add Item' }}</button>
                    <a href="{{ url_for('inventory.view_item', item_id=item.item_id) if item else url_for('inventory.list_items') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
