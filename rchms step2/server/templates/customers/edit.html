{% extends "base.html" %}
{% block title %}Edit Customer{% endblock %}

{% block content %}
<div class="form-shell">
    <div class="form-shell-icon"><i data-lucide="pencil"></i></div>
    <h1 class="page-title" style="font-size: 1.4rem;">Edit Customer</h1>
    <p class="page-subtitle mb-4">Membership ID: <code>{{ customer.membership_code }}</code> (cannot be changed)</p>

    <div class="card">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('customers.edit_customer', customer_id=customer.customer_id) }}">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="full_name" value="{{ customer.full_name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" class="form-control" name="phone_number" value="{{ customer.phone_number }}" required>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-brand">Save Changes</button>
                    <a href="{{ url_for('customers.view_customer', customer_id=customer.customer_id) }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
