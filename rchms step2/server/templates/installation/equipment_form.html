{% extends "base.html" %}
{% block title %}Assign Equipment — {{ job.subscriber.full_name }}{% endblock %}

{% block content %}
<div class="form-shell" style="max-width: 560px;">
    <div class="form-shell-icon gold"><i data-lucide="package"></i></div>
    <h1 class="page-title" style="font-size: 1.4rem;">Assign Equipment</h1>
    <p class="page-subtitle mb-4">{{ job.subscriber.full_name }}'s installation job</p>

    <div class="card">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('installation.new_equipment', job_id=job.installation_id) }}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Dish Serial</label>
                        <input type="text" class="form-control" name="dish_serial">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Router Serial</label>
                        <input type="text" class="form-control" name="router_serial">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Cable Length (m)</label>
                        <input type="number" step="0.01" class="form-control" name="cable_length">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Mount Type</label>
                        <input type="text" class="form-control" name="mount_type" placeholder="e.g. roof mount, pole mount">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Assigned By</label>
                        <select class="form-select" name="assigned_by">
                            {% for member in staff %}
                            <option value="{{ member.user_id }}" {% if current_user.user_id == member.user_id %}selected{% endif %}>{{ member.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Assigned Date</label>
                        <input type="date" class="form-control" name="assigned_date" value="{{ today }}">
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-gold">Assign Equipment</button>
                    <a href="{{ url_for('installation.view_job', job_id=job.installation_id) }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
