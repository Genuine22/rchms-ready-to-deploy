{% extends "base.html" %}
{% block title %}Installation Report — {{ job.subscriber.full_name }}{% endblock %}

{% block content %}
<div class="form-shell" style="max-width: 560px;">
    <div class="form-shell-icon gold"><i data-lucide="file-text"></i></div>
    <h1 class="page-title" style="font-size: 1.4rem;">Installation Report</h1>
    <p class="page-subtitle mb-4">{{ job.subscriber.full_name }}'s installation job</p>

    <div class="card">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('installation.new_report', job_id=job.installation_id) }}">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Download (Mbps)</label>
                        <input type="number" step="0.01" class="form-control" name="download_speed">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Upload (Mbps)</label>
                        <input type="number" step="0.01" class="form-control" name="upload_speed">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Latency (ms)</label>
                        <input type="number" class="form-control" name="latency">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Customer Name <span class="text-muted">(on-site contact who signed off)</span></label>
                    <input type="text" class="form-control" name="customer_name" value="{{ job.subscriber.full_name }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Completion Date</label>
                    <input type="date" class="form-control" name="completion_date" value="{{ today }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Installer Notes</label>
                    <textarea class="form-control" name="installer_notes" rows="3"></textarea>
                </div>

                <p class="text-muted small">Saving this report will also mark the installation job as Completed.</p>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-gold">Save Report</button>
                    <a href="{{ url_for('installation.view_job', job_id=job.installation_id) }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
