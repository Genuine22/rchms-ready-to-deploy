{% extends "base.html" %}
{% block title %}Site Survey — {{ subscriber.full_name }}{% endblock %}

{% block content %}
<div class="form-shell" style="max-width: 620px;">
    <div class="form-shell-icon gold"><i data-lucide="map-pin"></i></div>
    <h1 class="page-title" style="font-size: 1.4rem;">Site Survey</h1>
    <p class="page-subtitle mb-4">{{ subscriber.full_name }} &middot; {{ subscriber.phone_number }}{% if subscriber.location %} &middot; {{ subscriber.location }}{% endif %}</p>

    <div class="card">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('installation.new_survey') }}">
                <input type="hidden" name="subscriber_id" value="{{ subscriber.subscriber_id }}">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Surveyor</label>
                        <select class="form-select" name="surveyor_id">
                            <option value="">Not assigned</option>
                            {% for member in staff %}
                            <option value="{{ member.user_id }}" {% if current_user.user_id == member.user_id %}selected{% endif %}>{{ member.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Survey Date</label>
                        <input type="date" class="form-control" name="survey_date" value="{{ today }}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">GPS Location <span class="text-muted">(optional)</span></label>
                    <input type="text" class="form-control" name="gps_location" placeholder="e.g. 5.6037,-0.1870">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Roof Type</label>
                        <input type="text" class="form-control" name="roof_type" placeholder="e.g. aluminium sheet, concrete slab">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Mount Type</label>
                        <input type="text" class="form-control" name="mount_type" placeholder="e.g. roof mount, pole mount">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Obstruction Level</label>
                    <select class="form-select" name="obstruction_level">
                        <option value="none" selected>None</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Estimated Cable Length (m)</label>
                        <input type="number" step="0.01" class="form-control" name="estimated_cable_length">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Estimated Cost (GHS)</label>
                        <input type="number" step="0.01" class="form-control" name="estimated_cost">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Remarks</label>
                    <textarea class="form-control" name="remarks" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" name="status">
                        <option value="pending" selected>Pending</option>
                        <option value="completed">Completed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-gold">Save Survey</button>
                    <a href="{{ url_for('starlink.view_subscriber', subscriber_id=subscriber.subscriber_id) }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
