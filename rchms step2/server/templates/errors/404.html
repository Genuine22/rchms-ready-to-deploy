{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height: 60vh;">
    <div class="signal-node mb-3" style="--node-color: var(--color-ink-muted); width: 72px; height: 72px;"></div>
    <h2 class="mb-2">Page not found</h2>
    <p class="text-muted mb-4">The page you're looking for doesn't exist or may have moved.</p>
    <a href="{{ url_for('dashboard.home') }}" class="btn btn-brand">
        <i data-lucide="home"></i> Back to Dashboard
    </a>
</div>
{% endblock %}
