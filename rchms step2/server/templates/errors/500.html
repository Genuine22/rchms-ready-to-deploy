{% extends "base.html" %}
{% block title %}Something Went Wrong{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height: 60vh;">
    <div class="signal-node mb-3 is-urgent" style="--node-color: var(--color-danger); width: 72px; height: 72px;"></div>
    <h2 class="mb-2">Something went wrong</h2>
    <p class="text-muted mb-4">
        An unexpected error occurred. The details have been saved to the server log.<br>
        Try going back, or restart the server if this keeps happening.
    </p>
    <a href="{{ url_for('dashboard.home') }}" class="btn btn-brand">
        <i data-lucide="home"></i> Back to Dashboard
    </a>
</div>
{% endblock %}
